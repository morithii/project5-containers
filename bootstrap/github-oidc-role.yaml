AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Project 5 bootstrap - lets GitHub Actions in morithii/project5-containers
  deploy to AWS with short-lived OIDC credentials (no stored access keys).
  Deployed ONCE by hand; everything else is deployed by the pipeline.

Parameters:
  GitHubOrg:
    Type: String
    Default: morithii
  RepoName:
    Type: String
    Default: project5-containers
  # GitHub's "immutable subject" format adds the permanent numeric IDs of the
  # account and repo to the OIDC token, e.g. repo:morithii@77978732/project5-containers@1428648939
  # IDs never change, so a renamed/deleted-and-recreated repo can't reuse this trust.
  # Find them with: gh api repos/OWNER/REPO/actions/oidc/customization/sub
  GitHubOrgId:
    Type: String
    Default: '77978732'
  RepoId:
    Type: String
    Default: '1428648939'
  # The GitHub OIDC provider can exist only once per account. Project 2 most
  # likely created it already - paste its ARN here to reuse it. Leave it
  # empty and this template creates a new one.
  OIDCProviderArn:
    Type: String
    Default: ''

Conditions:
  CreateProvider: !Equals [!Ref OIDCProviderArn, '']

Resources:
  # Only created if no existing provider ARN was passed in
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: github-actions-project5-deploy
      # TRUST POLICY - who may assume this role:
      # only GitHub's OIDC tokens, only for this repo, only from the main branch
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If [CreateProvider, !Ref GitHubOIDCProvider, !Ref OIDCProviderArn]
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOrg}@${GitHubOrgId}/${RepoName}@${RepoId}:ref:refs/heads/main
      # PERMISSIONS - what the pipeline may do once it has assumed the role
      Policies:
        - PolicyName: project5-deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Manage only CloudFormation stacks whose names start with "project5-"
              - Sid: CloudFormationProject5Stacks
                Effect: Allow
                Action: cloudformation:*
                Resource: !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/project5-*/*
              # Read-only calls that the "aws cloudformation deploy" command needs
              - Sid: CloudFormationGlobal
                Effect: Allow
                Action:
                  - cloudformation:ValidateTemplate
                  - cloudformation:GetTemplateSummary
                Resource: '*'

              # "docker login" to ECR - this action cannot be scoped to a repo
              - Sid: EcrLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              # Push/pull/manage only the Product Service repo (the workbook's name)
              # and any repo whose name starts with "project5-"
              - Sid: EcrProject5Repos
                Effect: Allow
                Action: ecr:*
                Resource:
                  - !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/product-service
                  - !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/project5-*

              # CloudFormation creates the infrastructure using THIS role's permissions,
              # so the role needs the services the stacks will contain.
              # Kept broad for the bootcamp - tighten later as a security exercise.
              - Sid: ContainerInfrastructure
                Effect: Allow
                Action:
                  - ecs:*                       # cluster, task definitions, service
                  - ec2:*                       # VPC, subnets, security groups
                  - elasticloadbalancing:*      # ALB in front of the containers
                  - logs:*                      # CloudWatch log group for container logs
                  - cloudwatch:*                # dashboards and alarms
                  - application-autoscaling:*   # ECS service auto scaling
                  - autoscaling:*               # EC2 Auto Scaling Group behind the ECS capacity provider
                  - rds:*                       # the products database
                  - secretsmanager:*            # database credentials secret
                  - ssm:GetParameter            # look up the latest ECS-optimized AMI ID
                  - ssm:GetParameters
                Resource: '*'
              # RDS-managed master password: RDS encrypts the secret with the
              # AWS-managed Secrets Manager KMS key using the caller's permissions.
              # Only allowed when the request comes through Secrets Manager or RDS.
              - Sid: KmsForRdsManagedSecret
                Effect: Allow
                Action:
                  - kms:DescribeKey
                  - kms:CreateGrant
                  - kms:GenerateDataKey
                  - kms:Decrypt
                Resource: '*'
                Condition:
                  StringLike:
                    kms:ViaService:
                      - !Sub secretsmanager.${AWS::Region}.amazonaws.com
                      - !Sub rds.${AWS::Region}.amazonaws.com

              # Let stacks create IAM roles (e.g. the ECS task execution role)
              # but only roles named "project5-*" (CFN names them after the stack)
              - Sid: IamProject5Roles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/project5-*
              # EC2 launch type: the container hosts need an instance profile
              # (the "wrapper" that attaches an IAM role to an EC2 instance)
              - Sid: IamProject5InstanceProfiles
                Effect: Allow
                Action:
                  - iam:CreateInstanceProfile
                  - iam:DeleteInstanceProfile
                  - iam:GetInstanceProfile
                  - iam:AddRoleToInstanceProfile
                  - iam:RemoveRoleFromInstanceProfile
                  - iam:TagInstanceProfile
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:instance-profile/project5-*
              # Hand those roles to ECS tasks and to the EC2 container hosts - nothing else
              - Sid: PassRoleToEcsTasksAndHosts
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/project5-*
                Condition:
                  StringEquals:
                    iam:PassedToService:
                      - ecs-tasks.amazonaws.com   # task role + task execution role
                      - ec2.amazonaws.com         # container host instance role
                      - ecs.amazonaws.com         # ECS infrastructure role (blue/green)
              # First-time use of ECS/ELB/autoscaling needs AWS's own service-linked roles
              - Sid: ServiceLinkedRoles
                Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: '*'
                Condition:
                  StringEquals:
                    iam:AWSServiceName:
                      - ecs.amazonaws.com
                      - elasticloadbalancing.amazonaws.com
                      - ecs.application-autoscaling.amazonaws.com
                      - autoscaling.amazonaws.com
                      - rds.amazonaws.com

Outputs:
  DeployRoleArn:
    Description: Store this in the GitHub repo as the AWS_ROLE_ARN variable
    Value: !GetAtt DeployRole.Arn
