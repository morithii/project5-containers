AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Project 5 - Product Service on Amazon ECS (EC2 launch type).
  Exercise 3: VPC + RDS MySQL + ECS cluster on a Graviton Auto Scaling Group + task definition.
  Exercise 4: ECS Service behind an Application Load Balancer, with service auto scaling.
  CI/CD exercise: CodeDeploy blue/green (two target groups, test listener, deployment group).
  Optimisation exercise: tasks moved from EC2 hosts to AWS Fargate (serverless containers).

# =============================================================================
# PARAMETERS
# =============================================================================
Parameters:
  ImageTag:
    Type: String
    Default: v2
    Description: Tag of the product-service image in ECR to run (the pipeline passes the git SHA)

  InstanceType:
    Type: String
    Default: t4g.small     # Graviton (ARM64), 2 vCPU / 2 GiB - matches our arm64 image
    AllowedValues: [t4g.micro, t4g.small, t4g.medium]

  # AWS publishes the latest ECS-optimized AMI ID in SSM Parameter Store.
  # This "SSM parameter type" makes CloudFormation look it up at deploy time,
  # so the hosts always launch with the current, patched ECS AMI.
  EcsAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ecs/optimized-ami/amazon-linux-2023/arm64/recommended/image_id

# =============================================================================
# RESOURCES
# =============================================================================
Resources:

  # ---------------------------------------------------------------------------
  # NETWORKING
  # 2 public subnets  -> container hosts (and the ALB in Exercise 4)
  # 2 private subnets -> RDS (no route to the internet at all)
  # No NAT gateway on purpose: it costs ~$35/month. The hosts have public IPs
  # so the ECS agent can pull images from ECR, but their security group only
  # lets in traffic we explicitly allow.
  # ---------------------------------------------------------------------------
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.50.0.0/16
      EnableDnsSupport: true        # both required for the RDS endpoint
      EnableDnsHostnames: true      # hostname to resolve inside the VPC
      Tags: [{ Key: Name, Value: project5-vpc }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{ Key: Name, Value: project5-igw }]

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  # !Select / !GetAZs picks the 1st and 2nd Availability Zones in the region,
  # so the template works in any region without hard-coding "eu-west-2a".
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.50.0.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: project5-public-a }]

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.50.1.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: project5-public-b }]

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.50.10.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags: [{ Key: Name, Value: project5-private-a }]

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.50.11.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags: [{ Key: Name, Value: project5-private-b }]

  # Public route table: send all non-VPC traffic (0.0.0.0/0) to the internet gateway
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: project5-public-rt }]

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable
  # (Private subnets use the VPC's main route table: local traffic only.)

  # ---------------------------------------------------------------------------
  # SECURITY GROUPS
  # ---------------------------------------------------------------------------
  # Exercise 4: the load balancer is the ONLY public entry point.
  # Anyone on the internet may reach it on port 80...
  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public ALB for the Product Service
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP from anywhere
        # Blue/green TEST listener: during a deployment CodeDeploy points this
        # port at the new (green) tasks so you can try them before real users do.
        # Open to anyone for simplicity - in production, restrict to your IP/VPN.
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 0.0.0.0/0
          Description: Blue/green test traffic
      Tags: [{ Key: Name, Value: project5-alb-sg }]

  # ...but the container hosts now accept traffic ONLY from the load balancer.
  # (Exercise 3's temporary "my IP" rule is gone.)
  ContainerHostSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ECS container hosts - Product Service
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        # Bridge networking with dynamic host ports: Docker maps container
        # port 3000 to a random host port in the Linux ephemeral range, and
        # the ALB sends traffic to whichever port each task got.
        - IpProtocol: tcp
          FromPort: 32768
          ToPort: 65535
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
          Description: Dynamic container ports - from the ALB only
      # No egress rules listed = default "allow all outbound"
      # (needed to reach ECR, CloudWatch Logs, Secrets Manager and RDS).
      Tags: [{ Key: Name, Value: project5-hosts-sg }]

  # FARGATE: with awsvpc networking every TASK gets its own network interface
  # and IP address, so the firewall is attached to the task itself - not to a
  # host. Tasks listen on their real port 3000 (no more random host ports).
  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Product Service Fargate tasks
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
          Description: App port - from the ALB only
      # Default allow-all outbound: reach ECR, CloudWatch Logs, Secrets Manager, RDS
      Tags: [{ Key: Name, Value: project5-tasks-sg }]

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RDS MySQL - only reachable from the container hosts
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        # Referencing a security group (not an IP range) means "any instance
        # in that group" - so new hosts added by Auto Scaling get access automatically.
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref ContainerHostSecurityGroup
          Description: MySQL from ECS container hosts (EC2 - removed in phase 2)
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref TaskSecurityGroup
          Description: MySQL from Fargate tasks
      Tags: [{ Key: Name, Value: project5-db-sg }]

  # ---------------------------------------------------------------------------
  # DATABASE - Amazon RDS for MySQL
  # ---------------------------------------------------------------------------
  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for the Product Service database
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]

  Database:
    Type: AWS::RDS::DBInstance
    # Bootcamp setting: delete the DB with the stack, no final snapshot (no
    # leftover storage bills). In production use Snapshot or Retain.
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: project5-products-db
      Engine: mysql
      EngineVersion: '8.4.11'           # pinned; RDS applies minor patches in the maintenance window
      DBInstanceClass: db.t4g.micro      # smallest Graviton class (~$15/month)
      AllocatedStorage: '20'
      StorageType: gp3
      StorageEncrypted: true
      DBName: products                   # creates the "products" database
      MasterUsername: admin
      # RDS generates the password and stores it in AWS Secrets Manager.
      # It never appears in this template, the console, or your terminal -
      # the ECS task reads it from Secrets Manager at startup.
      ManageMasterUserPassword: true
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups: [!Ref DatabaseSecurityGroup]
      PubliclyAccessible: false
      MultiAZ: false                     # single AZ to save cost (DR comes later)
      BackupRetentionPeriod: 1
      DeletionProtection: false

  # ---------------------------------------------------------------------------
  # ECS CLUSTER + EC2 CAPACITY
  # ---------------------------------------------------------------------------
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: project5-cluster
      ClusterSettings:
        # Monitoring exercise: Container Insights publishes extra per-service
        # metrics (DesiredTaskCount, RunningTaskCount, ...) to CloudWatch.
        # Small extra cost - roughly a few dollars/month for one small service.
        - Name: containerInsights
          Value: enabled

  # IAM role for the EC2 hosts: lets the ECS agent register with the cluster,
  # pull images from ECR and write container logs.
  ContainerHostRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role
        # Session Manager: open a shell on a host from the console/CLI without
        # SSH keys or an open port 22 - handy for debugging.
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  # An instance profile is the "container" that attaches an IAM role to EC2
  ContainerHostInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref ContainerHostRole]

  # Launch template = the blueprint for every host the Auto Scaling Group starts
  ContainerHostLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref EcsAmiId
        InstanceType: !Ref InstanceType
        IamInstanceProfile:
          Arn: !GetAtt ContainerHostInstanceProfile.Arn
        NetworkInterfaces:
          - DeviceIndex: 0
            AssociatePublicIpAddress: true
            Groups: [!Ref ContainerHostSecurityGroup]
        MetadataOptions:
          HttpTokens: required           # IMDSv2 only (blocks SSRF-style credential theft)
          HttpPutResponseHopLimit: 1     # containers can't reach the host's metadata/credentials
        # Runs once at first boot: tells the ECS agent which cluster to join.
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            echo "ECS_CLUSTER=${Cluster}" >> /etc/ecs/ecs.config
        TagSpecifications:
          - ResourceType: instance
            Tags: [{ Key: Name, Value: project5-ecs-host }]

  ContainerHostAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    # Hosts have public IPs, so they need the internet gateway. DependsOn makes
    # CloudFormation create the gateway attachment BEFORE the hosts, and - just
    # as important - delete the hosts BEFORE detaching the gateway. Without it,
    # stack deletion tries to detach the gateway while hosts still use it, fails,
    # and leaves the hosts cut off from ECS (so the Service delete hangs too).
    DependsOn: InternetGatewayAttachment
    Properties:
      VPCZoneIdentifier: [!Ref PublicSubnetA, !Ref PublicSubnetB]
      LaunchTemplate:
        LaunchTemplateId: !Ref ContainerHostLaunchTemplate
        Version: !GetAtt ContainerHostLaunchTemplate.LatestVersionNumber
      # MinSize 0: with no tasks running there are no hosts and no EC2 bill.
      # ECS managed scaling (below) adds a host when a task needs one.
      MinSize: '0'
      MaxSize: '2'
      Tags:
        # Required by ECS managed scaling to recognise its own instances
        - Key: AmazonECSManaged
          Value: ''
          PropagateAtLaunch: true

  # Capacity provider = the link between the cluster and the ASG.
  # Managed scaling: ECS watches how full the hosts are and grows/shrinks the
  # ASG so there's always room for the tasks you ask for.
  CapacityProvider:
    Type: AWS::ECS::CapacityProvider
    Properties:
      AutoScalingGroupProvider:
        AutoScalingGroupArn: !Ref ContainerHostAutoScalingGroup
        ManagedScaling:
          Status: ENABLED
          TargetCapacity: 100            # aim for hosts to be fully used
        ManagedTerminationProtection: DISABLED

  ClusterCapacityProviders:
    Type: AWS::ECS::ClusterCapacityProviderAssociations
    Properties:
      Cluster: !Ref Cluster
      # FARGATE and FARGATE_SPOT are built-in capacity providers - AWS runs the
      # servers. The EC2 capacity provider stays associated for THIS deploy only,
      # because the old service still uses it until CloudFormation deletes it.
      # Phase 2 removes it (and all the EC2 resources).
      CapacityProviders: [FARGATE, FARGATE_SPOT, !Ref CapacityProvider]
      DefaultCapacityProviderStrategy:
        - CapacityProvider: FARGATE
          Weight: 1

  # ---------------------------------------------------------------------------
  # TASK DEFINITION - "how to run the container"
  # ---------------------------------------------------------------------------
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/product-service
      RetentionInDays: 7               # don't keep (and pay for) logs forever

  # Task EXECUTION role: used by the ECS agent (not your code) to pull the
  # image, write logs, and fetch secrets before the container starts.
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-db-secret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Only THIS database's secret - nothing else in Secrets Manager
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !GetAtt Database.MasterUserSecret.SecretArn
  # (No task ROLE: the app itself never calls AWS APIs.)

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: product-service
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc                # required by Fargate: each task gets its own IP
      # Fargate sizes are set for the whole TASK and must be a valid pair
      # (0.25 vCPU with 0.5/1/2 GB). You pay for exactly this, per second.
      Cpu: '256'                         # 0.25 vCPU
      Memory: '512'                      # 0.5 GB
      # Our image is ARM64 - Fargate on Graviton is ~20% cheaper than x86.
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      ContainerDefinitions:
        - Name: product-service
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/product-service:${ImageTag}'
          Essential: true
          PortMappings:
            - ContainerPort: 3000        # awsvpc: host port is always the same as the container port
              Protocol: tcp
          Environment:
            - { Name: DB_HOST, Value: !GetAtt Database.Endpoint.Address }
            - { Name: DB_PORT, Value: !GetAtt Database.Endpoint.Port }
            - { Name: DB_NAME, Value: products }
            - { Name: DB_SSL, Value: 'true' }
            - { Name: DB_AUTO_MIGRATE, Value: 'true' }
          # Pulled from Secrets Manager by the agent at startup and handed to the
          # container as env vars - the values are never stored in the task
          # definition. The ":username::" suffix picks one key from the JSON secret.
          Secrets:
            - Name: DB_USER
              ValueFrom: !Sub '${Database.MasterUserSecret.SecretArn}:username::'
            - Name: DB_PASSWORD
              ValueFrom: !Sub '${Database.MasterUserSecret.SecretArn}:password::'
          LogConfiguration:
            LogDriver: awslogs           # container stdout/stderr -> CloudWatch Logs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: product-service
          HealthCheck:
            Command: ['CMD-SHELL', 'wget -qO- http://localhost:3000/health || exit 1']
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 15

  # ---------------------------------------------------------------------------
  # EXERCISE 4 - APPLICATION LOAD BALANCER
  # One stable public URL that spreads requests across all healthy tasks,
  # wherever ECS has placed them and whatever port they were given.
  # ---------------------------------------------------------------------------
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn: InternetGatewayAttachment   # same reason as the Auto Scaling Group
    Properties:
      Name: project5-alb
      Scheme: internet-facing
      Type: application
      Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]   # ALBs need 2+ AZs
      SecurityGroups: [!Ref LoadBalancerSecurityGroup]

  # Target groups = the lists of places the ALB can send traffic to.
  # FARGATE: TargetType "ip" - each target is a TASK's own IP address on port
  # 3000 (there are no EC2 hosts any more). A target group's type can't be
  # changed, so these are NEW target groups (new names) replacing the old ones.
  # ECS registers and deregisters tasks automatically as they start and stop.
  #
  # BLUE/GREEN needs TWO identical target groups. At any moment one holds the
  # live version (production traffic) and the other receives the new version
  # during a deployment. CodeDeploy swaps them on every deployment, so "blue"
  # and "green" are just names - either one can be live.
  TargetGroupBlue:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: project5-tg-blue-ip
      VpcId: !Ref Vpc
      Protocol: HTTP
      Port: 3000
      TargetType: ip
      HealthCheckPath: /health         # the DB-independent health endpoint
      HealthCheckPort: traffic-port    # check each task on ITS dynamic port
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2         # 2 passes (~30s) before a new task gets traffic
      UnhealthyThresholdCount: 3
      Matcher: { HttpCode: '200' }
      TargetGroupAttributes:
        # Wait 30s (default 300s) for in-flight requests to finish before a
        # task is removed - pairs with the app's graceful shutdown.
        - Key: deregistration_delay.timeout_seconds
          Value: '30'

  TargetGroupGreen:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: project5-tg-green-ip
      VpcId: !Ref Vpc
      Protocol: HTTP
      Port: 3000
      TargetType: ip
      HealthCheckPath: /health
      HealthCheckPort: traffic-port
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: { HttpCode: '200' }
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'

  # PRODUCTION listener (port 80) - what real users hit.
  # IMPORTANT: after the first blue/green deployment CodeDeploy changes which
  # target group this listener forwards to. Don't edit these listeners in the
  # template afterwards, or CloudFormation would point them back at blue.
  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroupBlue

  # TEST listener (port 8080) - CodeDeploy routes it to the green tasks while
  # a deployment waits for approval, so you can test the new version first.
  TestListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 8080
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroupBlue

  # ---------------------------------------------------------------------------
  # ECS SERVICE (Exercise 4, switched to blue/green in the CI/CD exercise)
  # A service keeps the desired number of tasks running at all times and
  # replaces tasks that crash or fail health checks.
  #
  # DeploymentController CODE_DEPLOY hands deployments over to CodeDeploy:
  # the service no longer does rolling updates itself.
  # Switching controller REPLACES the service, so it gets a new name
  # (product-service-bg) to avoid clashing with the old one during the swap.
  #
  # LIMITATION to know: with CODE_DEPLOY, CloudFormation can no longer change
  # this service's task definition. New versions are deployed ONLY by the
  # pipeline (CodeDeploy registers each new task definition revision itself).
  # ---------------------------------------------------------------------------
  Service:
    Type: AWS::ECS::Service
    DependsOn: [HttpListener, TestListener, ClusterCapacityProviders]
    Properties:
      # New name again: launch type, networking and target groups can't change
      # on an existing service, so the Fargate version is a NEW service.
      ServiceName: product-service-fargate
      Cluster: !Ref Cluster
      DeploymentController:
        Type: CODE_DEPLOY
      TaskDefinition: !Ref TaskDefinition   # only used when the service is first created
      DesiredCount: 2                       # two copies for availability
      CapacityProviderStrategy:
        - CapacityProvider: FARGATE      # regular (on-demand) Fargate
          Weight: 1
      # awsvpc networking: which subnets and firewall each task's network
      # interface uses. Public subnets + public IP so tasks can reach ECR,
      # Secrets Manager and CloudWatch without a NAT gateway (~$35/month saved).
      # Inbound is still ONLY from the ALB, via the task security group.
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]   # Fargate spreads tasks across both AZs
          SecurityGroups: [!Ref TaskSecurityGroup]
          AssignPublicIp: ENABLED
      LoadBalancers:
        - TargetGroupArn: !Ref TargetGroupBlue   # starts on blue; CodeDeploy swaps later
          ContainerName: product-service
          ContainerPort: 3000
      # Ignore failing ALB health checks for the first 60s while a task boots.
      HealthCheckGracePeriodSeconds: 60
      # (No rolling-update settings or circuit breaker: CodeDeploy controls
      #  deployments now, and rolls back automatically if one fails.)
      # (No placement strategies: there are no hosts to choose between -
      #  Fargate spreads tasks across Availability Zones automatically.)

  # ---------------------------------------------------------------------------
  # EXERCISE 4 - SERVICE AUTO SCALING (tasks)
  # Two layers of scaling work together:
  #   1. Service auto scaling (here) changes the NUMBER OF TASKS based on CPU.
  #   2. Capacity provider managed scaling (above) changes the NUMBER OF EC2
  #      HOSTS so there is always room for those tasks.
  # ---------------------------------------------------------------------------
  ServiceScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      ResourceId: !Sub 'service/${Cluster}/${Service.Name}'
      MinCapacity: 2
      MaxCapacity: 4
      # No RoleARN: AWS uses the Application Auto Scaling service-linked role.

  ServiceCpuScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: product-service-cpu-target-tracking
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ServiceScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        # Add/remove tasks to keep average CPU across the service near 50%
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        TargetValue: 50
        ScaleOutCooldown: 60     # react quickly to load
        ScaleInCooldown: 300     # remove capacity slowly, avoids flapping

  # ---------------------------------------------------------------------------
  # CI/CD EXERCISE - CODEDEPLOY BLUE/GREEN
  # The pipeline (infra/pipeline.yaml) hands each new version to this
  # deployment group, which:
  #   1. starts a full set of GREEN tasks on the idle target group
  #   2. points the TEST listener (8080) at them and WAITS for approval
  #   3. on approval, switches the PRODUCTION listener (80) to green - instantly
  #   4. keeps the old BLUE tasks for 5 minutes (instant rollback), then stops them
  # If green tasks fail, it rolls back automatically.
  # ---------------------------------------------------------------------------
  CodeDeployServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: codedeploy.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # AWS-managed policy: lets CodeDeploy manage ECS task sets, the
        # load balancer listeners/target groups, and pass the task roles.
        - arn:aws:iam::aws:policy/AWSCodeDeployRoleForECS

  CodeDeployApplication:
    Type: AWS::CodeDeploy::Application
    Properties:
      ApplicationName: project5-product-service
      ComputePlatform: ECS

  CodeDeployDeploymentGroup:
    Type: AWS::CodeDeploy::DeploymentGroup
    Properties:
      ApplicationName: !Ref CodeDeployApplication
      DeploymentGroupName: project5-product-service-dg
      ServiceRoleArn: !GetAtt CodeDeployServiceRole.Arn
      # ECSAllAtOnce = shift 100% of traffic in one step once approved.
      # (Alternatives: ECSCanary10Percent5Minutes, ECSLinear10PercentEvery1Minutes)
      DeploymentConfigName: CodeDeployDefault.ECSAllAtOnce
      DeploymentStyle:
        DeploymentType: BLUE_GREEN
        DeploymentOption: WITH_TRAFFIC_CONTROL
      BlueGreenDeploymentConfiguration:
        # "Test & Validate": pause with green on the test port for up to 15
        # minutes. You approve ("Reroute traffic") or it stops and rolls back.
        # Set ActionOnTimeout: CONTINUE_DEPLOYMENT + WaitTimeInMinutes: 0 to
        # switch automatically with no pause.
        DeploymentReadyOption:
          ActionOnTimeout: STOP_DEPLOYMENT
          WaitTimeInMinutes: 15
        # "Decommission blue": keep old tasks 5 minutes for instant rollback.
        TerminateBlueInstancesOnDeploymentSuccess:
          Action: TERMINATE
          TerminationWaitTimeInMinutes: 5
      AutoRollbackConfiguration:
        Enabled: true
        Events: [DEPLOYMENT_FAILURE, DEPLOYMENT_STOP_ON_REQUEST]
      ECSServices:
        - ClusterName: !Ref Cluster
          ServiceName: !GetAtt Service.Name
      LoadBalancerInfo:
        TargetGroupPairInfoList:
          - TargetGroups:
              - Name: !GetAtt TargetGroupBlue.TargetGroupName
              - Name: !GetAtt TargetGroupGreen.TargetGroupName
            ProdTrafficRoute:
              ListenerArns: [!Ref HttpListener]
            TestTrafficRoute:
              ListenerArns: [!Ref TestListener]

  # ---------------------------------------------------------------------------
  # MONITORING EXERCISE - CloudWatch dashboard
  # One screen showing cluster capacity, task counts and load balancer traffic.
  # !Sub fills in the real cluster/service/ALB names, so the dashboard always
  # points at THIS stack's resources.
  # ---------------------------------------------------------------------------
  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: project5-product-service
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric", "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "CPU used vs reserved (CPU units, Container Insights) - Fargate has no hosts to fill",
                "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 60,
                "metrics": [
                  [ "ECS/ContainerInsights", "CpuUtilized", "ClusterName", "${Cluster}", "ServiceName", "${Service.Name}" ],
                  [ "ECS/ContainerInsights", "CpuReserved", "ClusterName", "${Cluster}", "ServiceName", "${Service.Name}" ]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Tasks - desired vs running (Container Insights)",
                "region": "${AWS::Region}", "view": "timeSeries", "stat": "Average", "period": 60,
                "metrics": [
                  [ "ECS/ContainerInsights", "DesiredTaskCount", "ClusterName", "${Cluster}", "ServiceName", "${Service.Name}" ],
                  [ "ECS/ContainerInsights", "RunningTaskCount", "ClusterName", "${Cluster}", "ServiceName", "${Service.Name}" ]
                ]
              }
            },
            {
              "type": "metric", "x": 0, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Service CPU / memory utilisation (%) - drives auto scaling",
                "region": "${AWS::Region}", "view": "timeSeries", "stat": "Average", "period": 60,
                "metrics": [
                  [ "AWS/ECS", "CPUUtilization",    "ClusterName", "${Cluster}", "ServiceName", "${Service.Name}" ],
                  [ "AWS/ECS", "MemoryUtilization", "ClusterName", "${Cluster}", "ServiceName", "${Service.Name}" ]
                ],
                "annotations": { "horizontal": [ { "label": "Scaling target", "value": 50 } ] }
              }
            },
            {
              "type": "metric", "x": 12, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Load balancer - requests and errors",
                "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 60,
                "metrics": [
                  [ "AWS/ApplicationELB", "RequestCount",               "LoadBalancer", "${LoadBalancer.LoadBalancerFullName}" ],
                  [ "AWS/ApplicationELB", "HTTPCode_Target_4XX_Count",  "LoadBalancer", "${LoadBalancer.LoadBalancerFullName}" ],
                  [ "AWS/ApplicationELB", "HTTPCode_ELB_5XX_Count",     "LoadBalancer", "${LoadBalancer.LoadBalancerFullName}" ]
                ]
              }
            },
            {
              "type": "metric", "x": 0, "y": 12, "width": 12, "height": 6,
              "properties": {
                "title": "Response time (seconds) - p50 and p99",
                "region": "${AWS::Region}", "view": "timeSeries", "period": 60,
                "metrics": [
                  [ "AWS/ApplicationELB", "TargetResponseTime", "LoadBalancer", "${LoadBalancer.LoadBalancerFullName}", { "stat": "p50" } ],
                  [ "AWS/ApplicationELB", "TargetResponseTime", "LoadBalancer", "${LoadBalancer.LoadBalancerFullName}", { "stat": "p99" } ]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 12, "width": 12, "height": 6,
              "properties": {
                "title": "Healthy targets - blue vs green (watch them swap on deploys)",
                "region": "${AWS::Region}", "view": "timeSeries", "stat": "Minimum", "period": 60,
                "metrics": [
                  [ "AWS/ApplicationELB", "HealthyHostCount", "TargetGroup", "${TargetGroupBlue.TargetGroupFullName}",  "LoadBalancer", "${LoadBalancer.LoadBalancerFullName}", { "label": "Blue healthy" } ],
                  [ "AWS/ApplicationELB", "HealthyHostCount", "TargetGroup", "${TargetGroupGreen.TargetGroupFullName}", "LoadBalancer", "${LoadBalancer.LoadBalancerFullName}", { "label": "Green healthy" } ]
                ]
              }
            }
          ]
        }

# =============================================================================
# OUTPUTS
# =============================================================================
Outputs:
  DashboardUrl:
    Description: Open this to see the CloudWatch dashboard
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=project5-product-service'
  LoadBalancerUrl:
    Description: Public URL of the Product Service
    Value: !Sub 'http://${LoadBalancer.DNSName}/products'
  TestUrl:
    Description: Blue/green test URL - shows the NEW version while a deployment awaits approval
    Value: !Sub 'http://${LoadBalancer.DNSName}:8080/products'
  CodeDeployApplicationName:
    Value: !Ref CodeDeployApplication
  CodeDeployDeploymentGroupName:
    Value: project5-product-service-dg
  ServiceName:
    Value: !GetAtt Service.Name
  ClusterName:
    Value: !Ref Cluster
  CapacityProviderName:
    Value: !Ref CapacityProvider
  TaskDefinitionArn:
    Value: !Ref TaskDefinition
  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address
  DatabaseSecretArn:
    Description: Secrets Manager secret holding the DB username/password
    Value: !GetAtt Database.MasterUserSecret.SecretArn
  VpcId:
    Value: !Ref Vpc
    Export: { Name: project5-VpcId }
